# Corrected GitHub Actions workflow for S&S Rock Holdings Android AAB.
#
# Release build workflow: use the latest main source while keeping the
# existing Google Play upload signing key unchanged.
#
# Key changes vs. the old workflow:
#   1. NEVER generates a new upload keystore. The approved Google Play upload key
#      (SHA1 F5:50:9D:87:DE:AF:EA:A3:59:39:24:48:C1:9A:C2:FF:5A:DC:5D:27) is
#      supplied as a base64-encoded GitHub Actions secret and reused for every build.
#   2. Fails the build with a clear error if the keystore secret is missing, instead
#      of silently minting a replacement key.
#   3. Verifies the decoded keystore's certificate SHA1 matches the approved upload
#      key before signing, so a wrong key can never ship.
#   4. Asserts the Android applicationId is com.ssrockholdings.quarrymarketplace.
#
# Required GitHub repository secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64   - base64 of the approved upload-keystore.jks
#                                      (e.g. `base64 -w0 upload-keystore.jks`)
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD - keystore store password
#   ANDROID_UPLOAD_KEY_ALIAS         - key alias inside the keystore (e.g. "upload")
#   ANDROID_UPLOAD_KEY_PASSWORD      - password for that key alias
#
# The Google Play service-account JSON (GOOGLE_PLAY_SERVICE_ACCOUNT_JSON) is a
# SEPARATE secret used only by the verify-google-subscription backend function
# for Play Developer API access. It is NOT the upload keystore and is NOT used
# to sign the AAB.

name: Build Android Play AAB

on:
  push:
    paths:
      - '.github/workflows/android-play-aab.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_PACKAGE: com.ssrockholdings.quarrymarketplace
      APPROVED_UPLOAD_SHA1: F5:50:9D:87:DE:AF:EA:A3:59:39:24:48:C1:9A:C2:FF:5A:DC:5D:27

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Retrieve original upload-key backup from September 23
        uses: actions/download-artifact@v4
        with:
          name: SandS-Rock-Holdings-Google-Play
          run-id: 35873007623
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ssrock-original-release

      - name: Verify and prepare existing Google Play upload key
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/ssrock-approved-upload-keystore.jks"
          BACKUP="$RUNNER_TEMP/ssrock-original-release"
          if [[ -n "${ANDROID_UPLOAD_KEYSTORE_BASE64:-}" && -n "${ANDROID_UPLOAD_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_UPLOAD_KEY_ALIAS:-}" && -n "${ANDROID_UPLOAD_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            STOREPASS="$ANDROID_UPLOAD_KEYSTORE_PASSWORD"
            KEYPASS="$ANDROID_UPLOAD_KEY_PASSWORD"
            ALIAS="$ANDROID_UPLOAD_KEY_ALIAS"
            echo "Using securely configured GitHub upload key."
          else
            test -s "$BACKUP/upload-keystore.jks" || { echo "::error::Original September 23 keystore backup not found."; exit 1; }
            test -s "$BACKUP/UPLOAD-KEY-INFO.txt" || { echo "::error::Original September 23 recovery metadata missing."; exit 1; }
            cp "$BACKUP/upload-keystore.jks" "$KEYSTORE"
            STOREPASS="$(sed -n 's/^Keystore password: //p' "$BACKUP/UPLOAD-KEY-INFO.txt" | head -1)"
            KEYPASS="$(sed -n 's/^Key password: //p' "$BACKUP/UPLOAD-KEY-INFO.txt" | head -1)"
            ALIAS="$(sed -n 's/^Alias: //p' "$BACKUP/UPLOAD-KEY-INFO.txt" | head -1)"
            echo "Recovered original upload key within the temporary build runner."
          fi
          test -n "$STOREPASS" && test -n "$KEYPASS" && test -n "$ALIAS" || { echo "::error::Upload key recovery information is incomplete."; exit 1; }
          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"
          chmod 600 "$KEYSTORE"
          CERT_SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STOREPASS" -alias "$ALIAS" 2>/dev/null | awk '/SHA1:/ {print $2; exit}')"
          echo "Recovered upload-key certificate SHA1: $CERT_SHA1"
          if [ "$CERT_SHA1" != "$APPROVED_UPLOAD_SHA1" ]; then
            echo "::error::Recovered key does not match the approved Google Play upload certificate; refusing to sign."
            exit 1
          fi
          {
            echo "SSROCK_KEYSTORE=$KEYSTORE"
            echo "SSROCK_STORE_PASSWORD=$STOREPASS"
            echo "SSROCK_KEY_PASSWORD=$KEYPASS"
            echo "SSROCK_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"
          echo "Approved original Google Play upload key verified without generating or publishing a new key."

      - name: Install and build
        run: |
          npm ci
          npm install --no-save @capacitor/android@8.5.0
          npm run build
          rm -rf android
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Assert applicationId is com.ssrockholdings.quarrymarketplace
        shell: bash
        run: |
          set -euo pipefail
          APPID=$(grep -E 'applicationId' android/app/build.gradle | head -1 | sed -E 's/.*applicationId[[:space:]]+["'"'"']([^"'"'']+)["'"'"'].*/\1/')
          echo "applicationId from build.gradle: $APPID"
          if [ "$APPID" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::applicationId '$APPID' does not match expected '$EXPECTED_PACKAGE'. Check capacitor.config.ts appId."
            exit 1
          fi



      - name: Sign bundle
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$SSROCK_KEYSTORE" -storepass "$SSROCK_STORE_PASSWORD" -keypass "$SSROCK_KEY_PASSWORD" "$AAB" "$SSROCK_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$AAB"
          mkdir -p play-upload
          cp "$AAB" play-upload/SandS-Rock-Holdings-release.aab
          sha256sum play-upload/SandS-Rock-Holdings-release.aab > play-upload/SHA256.txt
          {
            echo "S&S Rock Holdings Android upload key (persistent, approved)"
            echo "Package: $EXPECTED_PACKAGE"
            echo "Approved upload cert SHA1: $APPROVED_UPLOAD_SHA1"
            echo "Alias: $SSROCK_KEY_ALIAS"
            echo "This keystore is reused for every release. Do not regenerate."
          } > play-upload/UPLOAD-KEY-INFO.txt
          rm -f "$SSROCK_KEYSTORE"

      - uses: actions/upload-artifact@v4
        with:
          name: SandS-Rock-Holdings-Google-Play
          path: play-upload/
          if-no-files-found: error
          retention-days: 90

name: iOS TestFlight Upload

on:
  # Normal uploads stay manual. A dedicated marker file can trigger one controlled upload
  # without turning every Base44 source commit into a TestFlight build.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".testflight-trigger"

permissions:
  contents: write

jobs:
  upload-testflight:
    name: Cloud sign and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Select Xcode 26.6
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=Select Xcode failed::Could not select or run Xcode 26.6"' ERR
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Set up Python for App Store Connect
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JavaScript dependencies
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=npm install failed::npm ci could not install the app dependencies"' ERR
          npm ci

      - name: Build web application
        env:
          VITE_BASE44_APP_ID: "6a78376a454093ba2f431acd"
          VITE_BASE44_FUNCTIONS_VERSION: "preview"
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=Web build failed::npm run build failed"' ERR
          npm run build
          grep -Rqs "6a78376a454093ba2f431acd" dist || {
            echo "::error title=Base44 app ID missing from native bundle::The built web bundle does not contain the production Base44 app ID";
            exit 1;
          }
          grep -Rqs "https://base44.app/api/apps/public" dist || {
            echo "::error title=Native public API host missing::The built web bundle still contains a relative public-settings API path";
            exit 1;
          }
          grep -Rqs "Work the quarry data from here" dist || {
            echo "::error title=Current Home workspace missing::The built bundle does not contain the new live quarry workspace";
            exit 1;
          }
          grep -Rqs "S&S Intelligence Center" dist || {
            echo "::error title=Intelligence Center missing::The built bundle does not contain the full S&S Intelligence Center";
            exit 1;
          }
          grep -Rqs "S&S Quarry Network Intelligence" dist || {
            echo "::error title=Quarry Network Intelligence missing::The built bundle does not contain the full company/quarry network intelligence workspace";
            exit 1;
          }
          grep -Rqs 'label:"Intel"' dist || grep -Rqs 'label: "Intel"' dist || {
            echo "::error title=Mobile Intel tab missing::The native web bundle does not expose Intelligence in the mobile tab bar";
            exit 1;
          }
          grep -Rqs 'label:"Network"' dist || grep -Rqs 'label: "Network"' dist || {
            echo "::error title=Mobile Network tab missing::The native web bundle does not expose Quarry Network in the mobile tab bar";
            exit 1;
          }
          if grep -Rqs "Use the full quarry intelligence toolkit" dist; then
            echo "::error title=Stale Home screen detected::The old promotional Intelligence Center is still present in the web bundle";
            exit 1;
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          grep -Rqs "$SHORT_SHA" dist || {
            echo "::error title=Build SHA missing::The web bundle does not contain the GitHub commit marker $SHORT_SHA";
            exit 1;
          }

      - name: Audit subscription-to-quarry access
        run: |
          set -Eeuo pipefail
          test ! -f src/components/TimedPreviewGate.jsx || {
            echo "::error title=Legacy preview gate returned::The retired 60-second gate is back in the app source";
            exit 1;
          }
          grep -q "com.ssrockholdings.mobile.quarryintelligence.monthly199" src/lib/subscriptionPlans.js || {
            echo "::error title=Apple product disconnected::The $199 Full Quarry Intelligence product ID is missing from the app";
            exit 1;
          }
          grep -q 'monthly: "$199/mo"' src/lib/subscriptionPlans.js || {
            echo "::error title=Wrong membership price::The current $199/month membership definition is missing";
            exit 1;
          }
          grep -Rqs "com.ssrockholdings.mobile.quarryintelligence.monthly199" dist || {
            echo "::error title=Apple product missing from iOS web bundle::The built app cannot recognize the current Apple subscription";
            exit 1;
          }
          if grep -RqsE '\$69|\$139|\$690|\$89|\$189|\$389|\$1,500|\$2,500|60-second preview|Your 60-second preview|ss-quarry-preview-start|Explore review demo|ss-apple-review-demo' src dist; then
            echo "::error title=Retired access model found::Old pricing, a retired preview gate, or the public review-demo bypass is present in the build";
            exit 1;
          fi
          if grep -qE 'com\.ssrockholdings\.(marketplace|deal)\.(monthly|annual)|com\.ssrockholdings\.professional\.(monthly|annual)' src/lib/subscriptionPlans.js; then
            echo "::error title=Legacy Apple products exposed::The client subscription catalog still contains a retired Apple subscription product";
            exit 1;
          fi
          node --input-type=module <<'NODE'
          import { ACCESS_TIERS, SUBSCRIPTION_PRODUCTS } from './src/lib/subscriptionPlans.js';
          if (ACCESS_TIERS.length !== 1 || ACCESS_TIERS[0]?.code !== 'professional') {
            throw new Error(`Expected exactly one client membership tier, got ${ACCESS_TIERS.length}`);
          }
          if (SUBSCRIPTION_PRODUCTS.apple?.professional?.monthly !== 'com.ssrockholdings.mobile.quarryintelligence.monthly199') {
            throw new Error('Current Apple Full Quarry Intelligence product ID is not the only client monthly product');
          }
          if (SUBSCRIPTION_PRODUCTS.apple?.professional?.annual) {
            throw new Error('An Apple annual plan is unexpectedly exposed by the client');
          }
          console.log('Single-tier client subscription catalog passed.');
          NODE
          grep -q 'stableAppleSubscriptionAccess({ attempts: 4 })' src/components/MembershipRequiredGate.jsx || {
            echo "::error title=Unstable membership gate::The iPhone membership gate must retry StoreKit before redirecting an active subscriber";
            exit 1;
          }
          grep -q 'accessState.checkedPath !== pathname' src/components/MembershipRequiredGate.jsx || {
            echo "::error title=Membership route race returned::Protected routes must wait for an entitlement check for the current path before redirecting";
            exit 1;
          }
          grep -q 'storeAccess?.active && storeAccess?.professional' src/components/MembershipRequiredGate.jsx || {
            echo "::error title=Membership gate mismatch::Quarry routes are not tied to Full Quarry Intelligence";
            exit 1;
          }
          grep -q 'stableAppleSubscriptionAccess({ attempts: 4 })' src/components/PaidAccessGate.jsx || {
            echo "::error title=Unstable paid-record gate::Detailed quarry pages must retry StoreKit before showing a paywall";
            exit 1;
          }
          grep -q 'storeAccess?.active && storeAccess?.professional' src/components/PaidAccessGate.jsx || {
            echo "::error title=Paid record gate mismatch::Detailed quarry pages are not tied to Full Quarry Intelligence";
            exit 1;
          }
          grep -q 'APPLE_ACCESS_CACHE_MS' src/lib/appleSubscriptions.js || {
            echo "::error title=Apple entitlement cache missing::A recently confirmed StoreKit entitlement must survive transient navigation checks";
            exit 1;
          }
          node --input-type=module <<'NODE'
          import { entitlementGrantsFullQuarryAccess } from './src/lib/subscriptionAccess.js';
          const future = new Date(Date.now() + 86400000).toISOString();
          const past = new Date(Date.now() - 86400000).toISOString();
          const checks = [
            ['professional active', { plan_code: 'professional_monthly', status: 'active', expires_at: future }, true],
            ['professional trial', { plan_code: 'professional_monthly', status: 'trial', expires_at: future }, true],
            ['professional grace period', { plan_code: 'professional_monthly', status: 'grace_period', expires_at: future }, true],
            ['expired professional', { plan_code: 'professional_monthly', status: 'active', expires_at: past }, false],
            ['retired marketplace tier', { plan_code: 'marketplace_monthly', status: 'active', expires_at: future }, false],
          ];
          for (const [name, row, expected] of checks) {
            const actual = entitlementGrantsFullQuarryAccess(row);
            if (actual !== expected) throw new Error(`${name}: expected ${expected}, got ${actual}`);
          }
          console.log('Full Quarry Intelligence entitlement rules passed.');
          NODE

      - name: Validate Quarry Network contract
        run: |
          set -Eeuo pipefail
          node scripts/validate_network_contract.mjs

      - name: Smoke test public quarry inventory
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { createClient } from '@base44/sdk';
          const client = createClient({
            appId: '6a78376a454093ba2f431acd',
            serverUrl: 'https://base44.app',
            requiresAuth: false,
          });
          const rows = await client.entities.MiningSite.list('-created_date', 10);
          if (!Array.isArray(rows) || rows.length === 0) {
            throw new Error('Public MiningSite inventory returned no records; refusing to upload an empty marketplace build.');
          }
          console.log(`Public quarry inventory smoke test returned ${rows.length} records.`);
          NODE
          grep -q "serverUrl: 'https://base44.app'" src/api/base44Client.js || {
            echo "::error title=Native API host missing::Base44 client is not pinned to the absolute production API host";
            exit 1;
          }

      - name: Sync Capacitor iOS project
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=Capacitor sync failed::npx cap sync ios failed"' ERR
          npx cap sync ios

      - name: Verify current web bundle reached iOS
        run: |
          set -Eeuo pipefail
          grep -Rqs "Work the quarry data from here" ios/App/App/public || {
            echo "::error title=Capacitor copied stale web assets::The iOS public bundle does not contain the new live quarry workspace";
            exit 1;
          }
          grep -Rqs "S&S Intelligence Center" ios/App/App/public || {
            echo "::error title=iOS Intelligence Center missing::The iPhone bundle does not contain the full S&S Intelligence Center";
            exit 1;
          }
          grep -Rqs "S&S Quarry Network Intelligence" ios/App/App/public || {
            echo "::error title=iOS Quarry Network missing::The iPhone bundle does not contain the full Quarry Network Intelligence workspace";
            exit 1;
          }
          if grep -Rqs "Use the full quarry intelligence toolkit" ios/App/App/public; then
            echo "::error title=Old Home screen copied into iOS::Refusing to upload a stale native bundle";
            exit 1;
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          grep -Rqs "$SHORT_SHA" ios/App/App/public || {
            echo "::error title=iOS build SHA mismatch::The iOS bundle does not contain the commit marker $SHORT_SHA";
            exit 1;
          }
          echo "Verified iOS web assets came from commit $GITHUB_SHA"

      - name: Pin iOS bundle to the App Store app under review
        run: |
          set -Eeuo pipefail
          IOS_BUNDLE_ID="com.base6a78376a454093ba2f431acd.app"
          python - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('ios/App/App.xcodeproj/project.pbxproj')
          s = p.read_text()
          bundle = 'com.base6a78376a454093ba2f431acd.app'
          build_number = os.environ['GITHUB_RUN_NUMBER']
          if not build_number.isdigit():
              raise SystemExit(f'Invalid GitHub run number for iOS build: {build_number!r}')
          s = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;', f'PRODUCT_BUNDLE_IDENTIFIER = {bundle};', s)
          s = re.sub(r'MARKETING_VERSION = [^;]+;', 'MARKETING_VERSION = 2.130297.2;', s)
          s = re.sub(r'CURRENT_PROJECT_VERSION = [^;]+;', f'CURRENT_PROJECT_VERSION = {build_number};', s)
          p.write_text(s)
          expected_bundle_line = f'PRODUCT_BUNDLE_IDENTIFIER = {bundle};'
          if expected_bundle_line not in s:
              raise SystemExit('Expected SS Mobile bundle identifier was not present after Capacitor sync')
          if 'MARKETING_VERSION = 2.130297.2;' not in s:
              raise SystemExit('Expected SS Mobile App Store marketing version was not present after Capacitor sync')
          if f'CURRENT_PROJECT_VERSION = {build_number};' not in s:
              raise SystemExit('Expected explicit iOS build number was not present after update')
          print(f'Pinned SS Mobile bundle identifier, App Store version 2.130297.2, and build {build_number}')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'IOS_BUILD_NUMBER={build_number}\n')
          PY

      - name: Install CocoaPods
        working-directory: ios/App
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=CocoaPods failed::pod install failed"' ERR
          pod install

      - name: Sync Apple subscriptions and detect active App Store key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_ISSUER_ID: "7097918c-2758-4720-b0fa-938914c24b36"
          ASC_KEY_IDS: "Q4783H7CJ6,2A3958GU5F"
          ASC_REPORT_PATH: "reports/apple_subscription_sync.json"
        run: |
          set -Eeuo pipefail
          test -n "$ASC_PRIVATE_KEY" || { echo "::error title=Missing App Store key::GitHub secret ASC_PRIVATE_KEY is not configured"; exit 1; }
          python -m pip install --quiet PyJWT cryptography requests
          python scripts/apple_subscription_sync.py
          python - <<'PY'
          import json, os, pathlib, sys
          report = json.loads(pathlib.Path("reports/apple_subscription_sync.json").read_text())
          key_id = report.get("key_id_used")
          products = report.get("products", {})
          required = {"com.ssrockholdings.mobile.quarryintelligence.monthly199"}
          missing = [pid for pid in sorted(required) if not products.get(pid, {}).get("id")]
          product_errors = [products.get(pid, {}).get("error") for pid in sorted(required) if products.get(pid, {}).get("error")]
          if not report.get("authenticated") or not key_id:
              raise SystemExit("App Store Connect authentication did not succeed")
          if report.get("bundle_id") != "com.base6a78376a454093ba2f431acd.app":
              raise SystemExit("Apple subscription sync targeted the wrong iOS app")
          if missing:
              raise SystemExit("Required Apple subscription is missing: " + ", ".join(missing))
          if product_errors or report.get("errors"):
              raise SystemExit("Apple subscription sync contains errors: " + " | ".join(product_errors + report.get("errors", [])))
          product = products["com.ssrockholdings.mobile.quarryintelligence.monthly199"]
          offer = product.get("introductory_offer") or {}
          if offer.get("offer_mode") != "FREE_TRIAL" or offer.get("duration") != "THREE_DAYS":
              raise SystemExit("Required 3-day Apple free trial was not verified")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ASC_KEY_ID={key_id}\n")
          print("Apple subscription sync check completed; continuing to build upload.")
          PY

      - name: Preserve Apple subscription sync result
        if: always()
        run: |
          if [ ! -f reports/apple_subscription_sync.json ]; then
            mkdir -p reports
            printf '%s\n' '{"authenticated":false,"errors":["Apple subscription sync did not produce a report"]}' > reports/apple_subscription_sync.json
          fi
          echo "Apple subscription sync report is available to later workflow steps."
          echo "The TestFlight upload intentionally does not commit/push generated reports back to main."

      - name: Prepare App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ASC_KEY_ID" || { echo "::error title=Missing App Store key ID::No valid key ID was detected"; exit 1; }
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive iOS app
        run: |
          set -Eeuo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/SSRockHoldings.xcarchive"
          rm -rf "$ARCHIVE_PATH"

          echo "Attempting normal automatic-signing archive first..."
          set +e
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID 7097918c-2758-4720-b0fa-938914c24b36 \
            clean archive
          NORMAL_STATUS=$?
          set -e

          if [ "$NORMAL_STATUS" -ne 0 ]; then
            echo "::warning title=Automatic archive signing failed::Retrying with an unsigned archive so App Store Connect cloud signing can sign during export."
            rm -rf "$ARCHIVE_PATH"
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              clean archive
          fi

          test -d "$ARCHIVE_PATH" || { echo "::error title=iOS archive failed::No archive was produced"; exit 1; }

      - name: Verify archived app contains current code
        run: |
          set -Eeuo pipefail
          APP_PUBLIC="$RUNNER_TEMP/SSRockHoldings.xcarchive/Products/Applications/App.app/public"
          test -d "$APP_PUBLIC" || { echo "::error title=Archive public bundle missing::No Capacitor public directory was found inside the archived app"; exit 1; }
          grep -Rqs "Work the quarry data from here" "$APP_PUBLIC" || {
            echo "::error title=Archived app is stale::The archive does not contain the new live quarry workspace";
            exit 1;
          }
          if grep -Rqs "Use the full quarry intelligence toolkit" "$APP_PUBLIC"; then
            echo "::error title=Archived app contains old Home screen::Refusing to upload stale code";
            exit 1;
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          grep -Rqs "$SHORT_SHA" "$APP_PUBLIC" || {
            echo "::error title=Archived commit mismatch::The archive does not contain commit marker $SHORT_SHA";
            exit 1;
          }
          echo "Archive contains current commit $GITHUB_SHA"

      - name: Verify archived version and build number
        run: |
          set -Eeuo pipefail
          INFO_PLIST="$RUNNER_TEMP/SSRockHoldings.xcarchive/Products/Applications/App.app/Info.plist"
          test -f "$INFO_PLIST" || { echo "::error title=Archive verification failed::App Info.plist was not found in the archive"; exit 1; }
          ARCHIVE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")
          ARCHIVE_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")
          echo "Archive version: $ARCHIVE_VERSION"
          echo "Archive build: $ARCHIVE_BUILD"
          test "$ARCHIVE_VERSION" = "2.130297.2" || { echo "::error title=Wrong App Store version::Expected 2.130297.2, got $ARCHIVE_VERSION"; exit 1; }
          test "$ARCHIVE_BUILD" = "$IOS_BUILD_NUMBER" || { echo "::error title=Wrong iOS build number::Expected $IOS_BUILD_NUMBER, got $ARCHIVE_BUILD"; exit 1; }

      - name: Create App Store Connect export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>ZSM7CZ94X2</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Cloud sign and upload to App Store Connect
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          UPLOAD_LOG="$RUNNER_TEMP/app-store-connect-upload.log"

          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/SSRockHoldings.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID 7097918c-2758-4720-b0fa-938914c24b36 \
            2>&1 | tee "$UPLOAD_LOG"
          XCODE_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$XCODE_STATUS" -ne 0 ]; then
            DETAILS=$(grep -Ei 'error:|exportArchive|provision|certificate|profile|App Store Connect|authentication|authorization|agreement|failed|not available|does not support|No Accounts|ITMS|Asset validation|distribution|upload' "$UPLOAD_LOG" | tail -n 60 || true)
            if [ -z "$DETAILS" ]; then
              DETAILS=$(tail -n 120 "$UPLOAD_LOG")
            fi

            # Keep only the useful Apple/Xcode failure excerpt and remove API-key identifiers/paths
            # before persisting diagnostics to the repository.
            SAFE_DETAILS="$DETAILS"
            SAFE_DETAILS="${SAFE_DETAILS//$ASC_KEY_ID/[REDACTED_KEY_ID]}"
            SAFE_DETAILS="${SAFE_DETAILS//7097918c-2758-4720-b0fa-938914c24b36/[REDACTED_ISSUER_ID]}"
            SAFE_DETAILS="${SAFE_DETAILS//$ASC_KEY_PATH/[REDACTED_KEY_PATH]}"

            {
              echo "### Apple signing/upload diagnostic"
              echo '```text'
              printf '%s\n' "$SAFE_DETAILS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            printf '%s\n' "$SAFE_DETAILS" > testflight-upload-error.txt

            # Persist the sanitized failure excerpt where the connected repo tools can read it.
            # This file is outside the workflow's push trigger path, so this commit will not
            # recursively start another TestFlight build.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --force testflight-upload-error.txt
            git commit -m "chore: save TestFlight upload diagnostic [skip ci]" || true
            git push origin HEAD:main || echo "::warning title=Diagnostic push failed::Could not persist testflight-upload-error.txt"

            ANNOTATION=$(printf '%s\n' "$SAFE_DETAILS" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c1-4000)
            echo "::error title=Apple signing/upload details::$ANNOTATION"
            exit "$XCODE_STATUS"
          fi

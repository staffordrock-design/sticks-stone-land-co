name: iOS TestFlight Upload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-testflight:
    name: Cloud sign and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Select Xcode 26.6
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=Select Xcode failed::Could not select or run Xcode 26.6"' ERR
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install JavaScript dependencies
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=npm install failed::npm ci could not install the app dependencies"' ERR
          npm ci

      - name: Build web application
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=Web build failed::npm run build failed"' ERR
          npm run build

      - name: Sync Capacitor iOS project
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=Capacitor sync failed::npx cap sync ios failed"' ERR
          npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=CocoaPods failed::pod install failed"' ERR
          pod install

      - name: Prepare App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          test -n "$ASC_PRIVATE_KEY" || { echo "::error title=Missing App Store key::GitHub secret ASC_PRIVATE_KEY is not configured"; exit 1; }
          KEY_PATH="$RUNNER_TEMP/AuthKey_Q4783H7CJ6.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive iOS app with automatic signing
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=iOS archive failed::Xcode could not archive/sign the iOS app"' ERR
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SSRockHoldings.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID Q4783H7CJ6 \
            -authenticationKeyIssuerID 7097918c-2758-4720-b0fa-938914c24b36 \
            clean archive

      - name: Create App Store Connect export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>ZSM7CZ94X2</string>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Cloud sign and upload to App Store Connect
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=TestFlight upload failed::Xcode could not export/upload the archive to App Store Connect"' ERR
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/SSRockHoldings.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID Q4783H7CJ6 \
            -authenticationKeyIssuerID 7097918c-2758-4720-b0fa-938914c24b36

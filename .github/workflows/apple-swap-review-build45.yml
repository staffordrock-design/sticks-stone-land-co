name: Swap Apple Review to Build 45

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apple-swap-review-build45.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swap-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet PyJWT cryptography requests

      - name: Switch Apple review from build 43 to build 45
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_ISSUER_ID: "7097918c-2758-4720-b0fa-938914c24b36"
          ASC_KEY_IDS: "Q4783H7CJ6,2A3958GU5F"
        run: python scripts/apple_swap_review_to_build45.py

      - name: Save sanitized swap report
        if: always()
        run: |
          if [ ! -f reports/apple_swap_build45.json ]; then
            mkdir -p reports
            printf '%s\n' '{"errors":["Swap workflow did not produce a report"]}' > reports/apple_swap_build45.json
          fi
          git config user.name "S&S Apple Review Swap"
          git config user.email "actions@users.noreply.github.com"
          git add reports/apple_swap_build45.json
          if git diff --cached --quiet; then
            echo "Swap report unchanged."
          else
            git commit -m "Record Apple review build 45 swap"
            git push
          fi

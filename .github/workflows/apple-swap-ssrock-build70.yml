name: Swap S&S Rock Holdings Review to Build 70
# Move the live 2.130297.4 review to the verified custom-icon build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apple-swap-ssrock-build70.yml"
      - "scripts/apple_swap_ssrock_to_build70.py"

permissions:
  contents: write

jobs:
  swap-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet PyJWT cryptography requests

      - name: Swap S&S Rock Holdings review from build 69 to custom-icon build 70
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_ISSUER_ID: "7097918c-2758-4720-b0fa-938914c24b36"
          ASC_KEY_IDS: "Q4783H7CJ6,2A3958GU5F"
        run: python scripts/apple_swap_ssrock_to_build70.py

      - name: Save sanitized swap report
        if: always()
        run: |
          if [ ! -f reports/apple_swap_ssrock_build70.json ]; then
            mkdir -p reports
            printf '%s\n' '{"errors":["S&S Rock Holdings build-70 swap did not produce a report"]}' > reports/apple_swap_ssrock_build70.json
          fi
          git config user.name "S&S Apple Build 70 Swap"
          git config user.email "actions@users.noreply.github.com"
          git add reports/apple_swap_ssrock_build70.json
          if git diff --cached --quiet; then
            echo "Swap report unchanged."
          else
            git commit -m "Record S&S Rock Holdings build 70 review swap"
            git push
          fi

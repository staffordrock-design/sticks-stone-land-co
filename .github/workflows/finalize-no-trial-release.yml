name: Finalize No-Trial App Release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install App Store Connect dependencies
        run: python -m pip install --quiet PyJWT cryptography requests

      - name: Finalize paid-only release when Apple approves
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_ISSUER_ID: "7097918c-2758-4720-b0fa-938914c24b36"
          ASC_KEY_IDS: "Q4783H7CJ6,2A3958GU5F"
          ASC_TARGET_VERSION: "2.130297.6"
        run: |
          set -Eeuo pipefail
          python scripts/apple_finalize_no_trial_release.py

name: Finish Apple Review - S&S Quarry Intelligence
# Uses whichever valid build is currently attached to App Store version 1.0 and records the live review state.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apple-finish-build45-review.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet PyJWT cryptography requests

      - name: Verify current attached build and finish Apple review
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_ISSUER_ID: "7097918c-2758-4720-b0fa-938914c24b36"
          ASC_KEY_IDS: "Q4783H7CJ6,2A3958GU5F"
        run: python scripts/apple_finish_build45_review.py

      - name: Save sanitized finish report
        if: always()
        run: |
          if [ ! -f reports/apple_finish_build45_review.json ]; then
            mkdir -p reports
            printf '%s\n' '{"errors":["Finish workflow did not produce a report"]}' > reports/apple_finish_build45_review.json
          fi
          git config user.name "S&S Apple Review Finish"
          git config user.email "actions@users.noreply.github.com"
          git add reports/apple_finish_build45_review.json
          if git diff --cached --quiet; then
            echo "Finish report unchanged."
          else
            git commit -m "Record completed Apple build 45 review submission"
            git push
          fi

name: Audit Apple Review Subscription Linkage
# Refresh live S&S Quarry Intelligence review/subscription state.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apple-review-link.yml"
      - "scripts/apple_review_link.py"

permissions:
  contents: write

jobs:
  audit-link:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet PyJWT cryptography requests

      - name: Validate App Store Connect credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          test -n "$ASC_PRIVATE_KEY" || { echo "::error::Missing ASC_PRIVATE_KEY GitHub secret"; exit 1; }

      - name: Audit pricing and safely link subscriptions to current review
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_ISSUER_ID: "7097918c-2758-4720-b0fa-938914c24b36"
          ASC_KEY_IDS: "Q4783H7CJ6,2A3958GU5F"
          ASC_REVIEW_REPORT_PATH: "reports/apple_review_link.json"
        run: python scripts/apple_review_link.py

      - name: Save sanitized Apple review linkage report
        if: success()
        run: |
          if [ ! -f reports/apple_review_link.json ]; then
            mkdir -p reports
            printf '%s\n' '{"authenticated":false,"errors":["Apple review linkage did not produce a report"]}' > reports/apple_review_link.json
          fi
          git config user.name "S&S Apple Review Audit"
          git config user.email "actions@users.noreply.github.com"
          git add reports/apple_review_link.json
          if git diff --cached --quiet; then
            echo "Review linkage report unchanged."
          else
            git commit -m "Update Apple review subscription linkage report"
            git push
          fi

name: Update Apple Store Metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apple-store-metadata.yml"
      - "scripts/apple_store_metadata_sync.py"
      - ".appstore-metadata-trigger"

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet PyJWT cryptography requests

      - name: Validate App Store Connect credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          test -n "$ASC_PRIVATE_KEY" || { echo "::error::Missing ASC_PRIVATE_KEY GitHub secret"; exit 1; }

      - name: Update S&S App Store name, subtitle, and search keywords
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_ISSUER_ID: "7097918c-2758-4720-b0fa-938914c24b36"
          ASC_KEY_IDS: "Q4783H7CJ6,2A3958GU5F"
          ASC_TARGET_VERSION: "2.130297.3"
          ASC_METADATA_REPORT_PATH: "reports/apple_store_metadata_sync.json"
        run: python scripts/apple_store_metadata_sync.py

      - name: Save sanitized metadata report
        if: always()
        run: |
          if [ ! -f reports/apple_store_metadata_sync.json ]; then
            mkdir -p reports
            printf '%s\n' '{"authenticated":false,"errors":["Metadata workflow did not produce a report"]}' > reports/apple_store_metadata_sync.json
          fi
          git config user.name "S&S Apple Metadata"
          git config user.email "actions@users.noreply.github.com"
          git add reports/apple_store_metadata_sync.json
          if git diff --cached --quiet; then
            echo "Metadata report unchanged."
          else
            git commit -m "Update Apple Store metadata report"
            git push
          fi
